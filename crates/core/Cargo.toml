[package]
name = "qingbird-core"
# 版本号单源在仓库根 `Cargo.toml` 的 `[workspace.package]`（32-13），别在这里写第二处
version.workspace = true
edition = "2021"
description = "qingbird-git 纯逻辑后端：git 子进程封装 / 代理探测 / 配置存储 / IPC 数据结构"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
# scheduler.rs 判「每天定时」到没到点，要的是**本地时区**的日期与时刻。
# 不自己算时区偏移：夏令时切换那天手算的偏移会整段偏一小时，
# 而这里错一小时的后果是"该跑的那天没跑"。0.4.45 本来就在
# 依赖树里（gpui-pre 拉进来的，已编译过），加进来零新增编译成本。
chrono = "0.4"
# 扫描结果缓存 + 操作历史（阶段 16 / Q14）。**用户拍板用 SQLite**：
# 最初我建议不上（数据量小、纯读缓存 JSON 5–15ms 就够），用户明确要
# 「记录这个仓库历史、更新了什么」之后结论反转——那是从「覆盖写一条」
# 变成**持续追加**，JSON 会越攒越大，那是 SQLite 的主场。
# `bundled` 把 sqlite3.c 静态编进来，不依赖系统装 SQLite，Windows 分发也干净。
# 实测本机 7.5 秒编过、中文与 emoji 往返正常（SQLite 3.53.2）。
rusqlite = { version = "0.40", features = ["bundled"] }
# CLI 工具图标要**编码**一张 PNG 落盘（`cli/icon.rs`：GDI 取到的是裸像素，
# 而界面那侧 `img()` 只认 gpui 解得开的图片格式）。
# ⚠️ **不是新引入的编译单元**：`png` 0.17 本来就在依赖树里
# （`tiny-skia` → `resvg` → `gpui-component` 那条链），纯 Rust、**无 build script**；
# 加这条边只让它从传递依赖变成直接依赖，编一次的事。
# 解码那半边不归我们：磁盘上那张图由 gpui 自己的 `ImageAssetLoader` 读
# （`elements/img.rs:669` 的 `image::guess_format`），所以不引 `image`。
png = "0.17"
# CLI 数据目录的**规则库**读一份 `rules.toml`（设计 §8.1：规则库是数据不是代码）。
# ⚠️ **不是新引入的编译单元**：`toml` 0.8 本来就在依赖树里
# （`rust-i18n-support` → `rust-i18n-macro` → `gpui-component` 那条链），纯 Rust、无 build script。
toml = "0.8"

[target.'cfg(windows)'.dependencies]
# CLI 工具图标提取（阶段二）多要四组绑定：
#   `Win32_UI_Shell`               → `ExtractIconExW`
#   `Win32_UI_WindowsAndMessaging` → `GetIconInfo` / `DestroyIcon` / `ICONINFO`
#   `Win32_Graphics_Gdi`           → `GetObjectW` / `GetDIBits` / `BI_RGB` / `BITMAPINFO`
#   `Win32_Storage_FileSystem`     → `SHGetFileInfoW` 那个入参类型（`FILE_FLAGS_AND_ATTRIBUTES`）
# 都是同一个 crate 多开几档 feature（windows-sys 是生成的绑定，**无 build script**）。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
